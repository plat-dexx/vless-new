<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS to Quantumult X Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-center mb-1 text-cyan-400">VLESS Sub to Quantumult X</h1>
        <p class="text-slate-400 text-center text-sm mb-6">Trình chuyển đổi tối ưu hóa giữ nguyên port chính xác cho V2Board.</p>

        <!-- Input Section -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-medium text-slate-300">1. Dán chuỗi Base64 Sub hoặc nội dung vless://</label>
                <button onclick="pasteFromClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1 font-medium shadow-sm cursor-pointer">
                    📋 Dán link
                </button>
            </div>
            <textarea id="inputText" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 font-mono transition" placeholder="Dán nội dung vào đây..."></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mb-6">
            <button id="convertBtn" onclick="convertVless()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-cyan-900/40 text-sm flex items-center justify-center gap-2 cursor-pointer">
                ⚡ Chuyển đổi
            </button>
            <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white font-semibold py-3 px-4 rounded-xl transition text-sm cursor-pointer">
                Xóa sạch
            </button>
        </div>

        <!-- Output Section -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-medium text-slate-300">2. Kết quả cấu hình Quantumult X</label>
                <button onclick="copyToClipboard()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 font-medium shadow-sm shadow-emerald-900/40 cursor-pointer">
                    📋 Sao chép
                </button>
            </div>
            <textarea id="outputText" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-emerald-400 font-mono focus:outline-none transition" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
        </div>
    </div>

    <script>
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputText').value = text;
            } catch (err) {
                alert('Trình duyệt chặn quyền đọc bộ nhớ tạm. Hãy giữ và chọn Dán thủ công.');
            }
        }

        async function copyToClipboard() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) {
                alert('Chưa có kết quả để sao chép!');
                return;
            }
            try {
                await navigator.clipboard.writeText(outputText);
                alert('Đã sao chép cấu hình vào bộ nhớ tạm!');
            } catch (err) {
                alert('Sao chép thất bại!');
            }
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        }

        function decodeBase64Unicode(str) {
            try {
                let cleaned = str.trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
                while (cleaned.length % 4) cleaned += '=';
                const binString = atob(cleaned);
                const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                return new TextDecoder().decode(bytes);
            } catch (e) {
                try {
                    let cleaned = str.trim().replace(/\s+/g, '');
                    return atob(cleaned);
                } catch (err) {
                    return null;
                }
            }
        }

        function convertVless() {
            let input = document.getElementById('inputText').value.trim();
            if (!input) {
                alert('Vui lòng nhập hoặc dán dữ liệu cần chuyển đổi!');
                return;
            }

            let btn = document.getElementById('convertBtn');
            btn.innerText = '⏳ Đang xử lý...';
            btn.disabled = true;

            try {
                let rawData = input;

                if (!rawData.startsWith('vless://')) {
                    let decoded = decodeBase64Unicode(rawData);
                    if (decoded) {
                        rawData = decoded;
                    }
                }

                let lines = rawData.split(/\r?\n/);
                let quanxLines = [];

                lines.forEach(line => {
                    line = line.trim();
                    if (!line.startsWith('vless://')) return;

                    try {
                        let content = line.substring(8);
                        let queryIndex = content.indexOf('?');
                        let hashIndex = content.indexOf('#');
                        
                        let core = content;
                        let queryString = '';
                        let hashString = '';
                        
                        if (queryIndex !== -1) {
                            core = content.substring(0, queryIndex);
                            let rest = content.substring(queryIndex + 1);
                            if (rest.includes('#')) {
                                let parts = rest.split('#');
                                queryString = parts[0];
                                hashString = parts[1];
                            } else {
                                queryString = rest;
                            }
                        } else if (hashIndex !== -1) {
                            core = content.substring(0, hashIndex);
                            hashString = content.substring(hashIndex + 1);
                        }

                        // Giải mã base64 phần core nếu là định dạng V2Board ẩn
                        if (!core.includes('@')) {
                            let decodedCore = decodeBase64Unicode(core);
                            if (decodedCore && decodedCore.includes('@')) {
                                core = decodedCore;
                            }
                        }

                        let atIndex = core.lastIndexOf('@');
                        if (atIndex === -1) return;

                        let userinfo = core.substring(0, atIndex);
                        let hostport = core.substring(atIndex + 1);

                        // Giải mã userinfo nếu bị mã hóa base64 con bên trong
                        let decodedUserInfo = decodeBase64Unicode(userinfo);
                        if (decodedUserInfo && decodedUserInfo.includes(':')) {
                            userinfo = decodedUserInfo;
                        }

                        let method = 'none';
                        let uuid = userinfo;
                        if (userinfo.includes(':')) {
                            let parts = userinfo.split(':');
                            method = parts[0] || 'none';
                            uuid = parts.slice(1).join(':');
                        }

                        // Bóc tách chính xác host và port (hỗ trợ cả port tùy chỉnh như 80, 8443...)
                        let host = hostport;
                        let port = '443';
                        let lastColon = hostport.lastIndexOf(':');
                        let closingBracket = hostport.lastIndexOf(']');
                        if (lastColon !== -1 && lastColon > closingBracket) {
                            host = hostport.substring(0, lastColon);
                            port = hostport.substring(lastColon + 1);
                        }

                        let params = new URLSearchParams(queryString);
                        let rawRemarks = params.get('remarks') || hashString || 'VLESS-Node';
                        let tag = rawRemarks;
                        try { tag = decodeURIComponent(rawRemarks); } catch(e) {}

                        let obfs = params.get('obfs') || params.get('type') || 'tcp';
                        let obfsParam = params.get('obfsParam') || params.get('host') || '';
                        let path = params.get('path') || '';
                        let udp = params.get('udp') || params.get('xudp');
                        let security = params.get('security') || '';
                        let sni = params.get('sni') || '';

                        let qxParts = [`vless=${host}:${port}`, `method=${method}`, `password=${uuid}`];

                        if (obfs === 'websocket' || obfs === 'ws') {
                            qxParts.push(`obfs=ws`);
                            if (obfsParam) qxParts.push(`obfs-host=${obfsParam}`);
                            if (path) qxParts.push(`obfs-uri=${path}`);
                        } else if (security === 'tls' || obfs === 'tls') {
                            qxParts.push(`obfs=over-tls`);
                            qxParts.push(`tls-host=${sni || obfsParam || host}`);
                            qxParts.push(`tls-verification=true`);
                        } else {
                            if (obfsParam) qxParts.push(`obfs-host=${obfsParam}`);
                            if (path) qxParts.push(`obfs-uri=${path}`);
                        }

                        if (udp === '1' || udp === 'true' || udp === 'xudp') {
                            qxParts.push(`udp-relay=true`);
                        }
                        qxParts.push(`tag=${tag}`);

                        quanxLines.push(qxParts.join(', '));
                    } catch (err) {
                        console.error('Lỗi phân tích line:', line, err);
                    }
                });

                if (quanxLines.length > 0) {
                    document.getElementById('outputText').value = quanxLines.join('\n');
                } else {
                    document.getElementById('outputText').value = "Không tìm thấy node vless hợp lệ nào!";
                }

            } catch (e) {
                alert('Có lỗi xảy ra trong quá trình xử lý!');
            } finally {
                btn.innerText = '⚡ Chuyển đổi';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
